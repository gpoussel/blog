name: Deploy

# Public-repo hardening (intentional, do not relax without thinking it through):
#   * No `pull_request` trigger  -> PRs (incl. from forks) never run this and never see secrets.
#   * `if: github.repository == ...` -> a fork has a different slug, so the deploy job no-ops there.
#   * Secrets live in the protected `production` environment, whose branch policy allows `main` only.
#   * Least-privilege token (`contents: read`), no third-party deploy action (native OpenSSH + rsync).
#   * Strict host-key verification (SFTP_KNOWN_HOSTS) defeats man-in-the-middle on the SSH endpoint.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily, so a post merged ahead of time goes live once its pubDate passes
    # (issue #16). 06:30 UTC: after the UTC-midnight flip used by
    # getPublishedPosts(), on an off-peak minute. The `gate` job below keeps
    # the ~364 no-op days cheap: the build+deploy only runs when the set of
    # published posts actually changed since the last successful run.
    - cron: "30 6 * * *"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt an in-flight upload
  # Known (improbable) edge: GitHub keeps only the newest *pending* run per
  # group, so a queued push deploy can be displaced by the daily scheduled run;
  # if that run's gate then says "unchanged", the push's body-only edits wait
  # for the next push or manual dispatch. Window is minutes wide, once a day.

jobs:
  gate:
    # Decides whether a deploy is warranted, without running the build.
    #   * push / workflow_dispatch -> always deploy (a human or a merge asked for it).
    #   * schedule -> deploy only if the set of published post slugs differs from
    #     the one certified by the last successful run of this workflow. After any
    #     successful run (deploying or not) the live site equals "published posts
    #     at that run's commit and start time", so comparing against it is sound.
    # Same fork guard as deploy; the ref check means nothing ever deploys off main
    # (schedule only fires on the default branch, but workflow_dispatch can pick a
    # branch, so it is checked explicitly).
    if: github.repository == 'gpoussel/blog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # to look up the last successful run of this workflow
    outputs:
      # Exactly one of the two steps runs per event, the other's output is empty.
      deploy: ${{ steps.always.outputs.deploy || steps.compare.outputs.deploy }}
    steps:
      - name: Deploy unconditionally (push or manual run)
        id: always
        if: github.event_name != 'schedule'
        run: echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Checkout (full history, to read posts at the last deployed commit)
        if: github.event_name == 'schedule'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        if: github.event_name == 'schedule'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node
        if: github.event_name == 'schedule'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: github.event_name == 'schedule'
        run: pnpm install --frozen-lockfile

      - name: Compare published posts with the last successful run
        id: compare
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # `|| true`: a transient API failure must not leave the gate stuck on
          # red; an empty $run falls into the deploy-anyway branch below.
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0] // empty' || true)"
          if [ -z "$run" ]; then
            echo "No successful Deploy run on main found: deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$(jq -r '.head_sha' <<<"$run")"
          base_time="$(jq -r '.run_started_at' <<<"$run")"
          echo "Last successful run: $base_sha (started $base_time)"

          # The script writes deploy=true/false to GITHUB_OUTPUT itself. Fail
          # open: a spurious deploy is a no-op upload (rsync --checksum) and
          # self-heals, whereas a gate stuck on red would silently stop
          # scheduled publishing.
          if ! pnpm tsx scripts/scheduled-deploy-gate.ts --base-sha "$base_sha" --base-time "$base_time"; then
            echo "::warning::scheduled-deploy-gate failed; deploying as a precaution."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    # Forks cannot deploy: their `github.repository` is `<their-user>/blog`, not this one.
    if: github.repository == 'gpoussel/blog' && needs.gate.outputs.deploy == 'true'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production # secrets + branch policy gate live here
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Astro image transforms
        # Persists .astro-cache (see `cacheDir` in astro.config.mjs), where
        # astro:assets stores the encoded AVIF/WebP variants, so a deploy only
        # encodes images added/changed since the last run instead of all of
        # them. The cache is content-addressed internally, so a stale
        # restore-keys hit is safe: new images are encoded, the rest is reused.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .astro-cache
          # pnpm-lock.yaml is in the key so a sharp/astro bump re-encodes from
          # scratch rather than serving variants produced by older encoders.
          key: astro-assets-${{ hashFiles('pnpm-lock.yaml', 'src/assets/**') }}
          restore-keys: astro-assets-

      - name: Build
        run: pnpm build

      - name: Install sshpass
        # rsync is preinstalled on ubuntu-latest; sshpass feeds the SFTP password to ssh.
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy dist/ over SSH (rsync)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_TARGET_DIR: ${{ secrets.SFTP_TARGET_DIR }}
        run: |
          set -euo pipefail

          # Materialize known_hosts into a private dir (runner is ephemeral, but be tidy).
          install -d -m 700 "$HOME/.sftp"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$HOME/.sftp/known_hosts"
          chmod 600 "$HOME/.sftp/known_hosts"

          PORT="${SFTP_PORT:-22}"
          # rsync runs over this ssh transport; sshpass -e feeds the password from the SSHPASS env
          # var (never on the command line, so it stays out of the process list). Auth + host-key
          # verification are identical to before: password only, no pubkey, strict known_hosts.
          export SSHPASS="$SFTP_PASSWORD"
          SSH="sshpass -e ssh -x -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.sftp/known_hosts -p $PORT"

          # Incremental upload: `--checksum` decides what to send by hashing file *contents*, not
          # size+mtime. The build regenerates dist/ from scratch every run, so every file has a fresh
          # mtime; without --checksum a timestamp-based tool re-uploads everything each deploy. With
          # it, only genuinely changed files move (and rsync sends just their changed blocks).
          #   -rlt        recurse, keep symlinks, preserve mtimes (no -p/-o/-g -> don't touch perms/owner)
          #   --delete-after  make the remote an exact copy of dist/, but prune only after a clean upload
          #   -z + skip   compress text transfers, skip already-compressed media (avif/images/woff2)
          #   --rsync-path  absolute path in case the non-interactive PATH lacks rsync
          rsync -rltz --checksum --delete-after \
            --skip-compress=avif/jpg/jpeg/png/webp/woff2/woff/gz/br/zip \
            --rsync-path=/usr/bin/rsync \
            --timeout=30 \
            --itemize-changes --human-readable --stats \
            -e "$SSH" \
            ./dist/ "$SFTP_USERNAME@$SFTP_HOST:$SFTP_TARGET_DIR/"

      - name: Clean up credentials
        if: always()
        run: rm -rf "$HOME/.sftp"
