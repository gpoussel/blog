name: Deploy

# Public-repo hardening (intentional, do not relax without thinking it through):
#   * No `pull_request` trigger  -> PRs (incl. from forks) never run this and never see secrets.
#   * `if: github.repository == ...` -> a fork has a different slug, so the deploy job no-ops there.
#   * Secrets live in the protected `production` environment, whose branch policy allows `main` only.
#   * Least-privilege token (`contents: read`), no third-party deploy action (native OpenSSH + lftp).
#   * Strict host-key verification (SFTP_KNOWN_HOSTS) defeats man-in-the-middle on the SFTP endpoint.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt an in-flight upload

jobs:
  deploy:
    # Forks cannot deploy: their `github.repository` is `<their-user>/blog`, not this one.
    if: github.repository == 'gpoussel/blog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production # secrets + branch policy gate live here
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install lftp and sshpass
        run: sudo apt-get update && sudo apt-get install -y lftp sshpass

      - name: Deploy dist/ over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_TARGET_DIR: ${{ secrets.SFTP_TARGET_DIR }}
        run: |
          set -euo pipefail

          # Materialize known_hosts into a private dir (runner is ephemeral, but be tidy).
          install -d -m 700 "$HOME/.sftp"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$HOME/.sftp/known_hosts"
          chmod 600 "$HOME/.sftp/known_hosts"

          PORT="${SFTP_PORT:-22}"
          # lftp's sftp backend delegates auth to ssh; sshpass -e feeds the password from the
          # SSHPASS env var (never on the command line, so it stays out of the process list).
          export SSHPASS="$SFTP_PASSWORD"
          SSH="sshpass -e ssh -x -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.sftp/known_hosts -p $PORT"

          # `mirror --reverse` uploads dist/ and `--delete` removes server files no longer present,
          # keeping the remote a faithful copy of the build. `--no-perms` avoids chmod on the server.
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:auto-confirm no;
            set sftp:connect-program \"$SSH\";
            open -u \"$SFTP_USERNAME,\" sftp://$SFTP_HOST;
            mirror --reverse --delete --no-perms --verbose ./dist \"$SFTP_TARGET_DIR\";
            bye
          "

      - name: Clean up credentials
        if: always()
        run: rm -rf "$HOME/.sftp"
